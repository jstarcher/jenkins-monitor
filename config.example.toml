# Jenkins Monitor configuration example
# Copy this file to config.toml (or point --config / JENKINS_MONITOR_CONFIG at
# it) and update with your settings. Keep it private: chmod 600 config.toml.

[general]
# Log level: error, warn, info, debug, trace (RUST_LOG overrides this)
log_level = "info"
# How often to check jobs (in seconds)
check_interval_seconds = 60
# Alert when the monitor itself can't check a job (Jenkins unreachable,
# bad credentials, unreadable schedule...)
alert_on_check_error = true
# ...but only after this many failed checks in a row
error_alert_after = 3
# Repeat an unresolved alert every N minutes (0 = alert once per problem)
realert_minutes = 0
# Send a "recovered" email when a job is healthy again
send_recovery = true

[jenkins]
url = "https://jenkins.example.com"
username = "your-username"
# Use a Jenkins API token, not your password. You can leave these out of the
# file and set JENKINS_MONITOR_JENKINS_USERNAME / JENKINS_MONITOR_JENKINS_PASSWORD
# in the environment instead.
password = "your-api-token"
# The time zone your Jenkins controller runs cron triggers in (its JVM
# default). A TZ= line inside a job's own spec still wins.
timezone = "UTC"

# One [[job]] section per job. Jobs inside folders use a slash-separated path:
# name = "folder/subfolder/job-name"
#
# schedule is optional. Leave it out and the monitor reads the job's timer
# trigger ("Build periodically") from Jenkins on every check. Set it to
# override what Jenkins says.
#
# Schedules use Jenkins syntax: 5 fields (minute hour day month weekday),
# H, H/15, H(0-29), @daily/@hourly/@weekly/@monthly/@yearly, several lines,
# # comments and TZ=Area/City. Weekdays are 0-7, with 0 and 7 both Sunday.
# 6-field specs (seconds first, cron-crate style) from older versions of this
# tool still work.
#
# alert_threshold_minutes is the grace period: how long after a scheduled
# time the build may start before the run counts as missed. Jobs using H get
# H's possible spread added automatically.

[[job]]
name = "nightly-build"
schedule = "H 2 * * *"            # once between 02:00 and 02:59
alert_threshold_minutes = 60

[[job]]
name = "hourly-tests"
schedule = "0 * * * *"            # on the hour
alert_threshold_minutes = 15

[[job]]
name = "team/weekday-report"
# No schedule: read from Jenkins.
alert_threshold_minutes = 30
# Optional per-job switches:
# alert_on_failure = true   # alert when the last completed build didn't succeed
# alert_on_error = false    # override general.alert_on_check_error for this job

# Email alerts (optional). Without this section alerts only go to the log.
[email]
smtp_host = "smtp.gmail.com"
smtp_port = 587
# starttls (usually port 587), tls (usually port 465), or none (local relay only)
smtp_security = "starttls"
from = "jenkins-monitor@example.com"
to = ["ops-team@example.com", "admin@example.com"]
# Or set JENKINS_MONITOR_SMTP_USERNAME / JENKINS_MONITOR_SMTP_PASSWORD.
username = "your-email@gmail.com"
password = "your-app-password"

# Note: For Gmail, you'll need an "App Password" instead of your regular password
# See: https://support.google.com/accounts/answer/185833
