[package]
name = "jenkins-monitor"
version = "0.2.0"
authors = ["Jordan Starcher <jstarcher@gmail.com>"]
edition = "2021"
rust-version = "1.75"
description = "Alerts when scheduled Jenkins jobs miss a run or fail"

[[bin]]
name = "jenkins-monitor"
path = "src/main.rs"
doc = false

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4.38", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
cron = "0.15"
env_logger = "0.11"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls", "hostname"] }
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
urlencoding = "2.1"

[dev-dependencies]
mockito = "1.5"

[package.metadata.deb]
name = "jenkins-monitor"
maintainer = "Jordan Starcher <jstarcher@gmail.com>"
assets = [
	["target/release/jenkins-monitor","/usr/local/bin/jenkins-monitor","755"],
	["packaging/jenkins-monitor.service","/lib/systemd/system/jenkins-monitor.service","644"],
	["config.example.toml","/etc/jenkins-monitor/config.example.toml","644"]
]
