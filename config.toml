# Local test config for a throwaway Jenkins at 127.0.0.1:8080.
# Don't put real credentials here: this file is tracked in git.
[general]
log_level = "info"
check_interval_seconds = 60

[jenkins]
url = "http://127.0.0.1:8080"
username = "admin"
password = "admin"

[[job]]
name = "test1"
schedule = "*/2 * * * *"        # every 2 minutes
alert_threshold_minutes = 5

[[job]]
name = "test2"
schedule = "0 2 * * *"          # daily at 2 AM
alert_threshold_minutes = 60

